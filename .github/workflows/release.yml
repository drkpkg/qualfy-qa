name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -n1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  deb:
    name: .deb (built on noble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: packaging/build-deb.sh 24.04
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  deb-smoke:
    name: .deb install (ubuntu ${{ matrix.ubuntu }})
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "25.04", "25.10", "26.04"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: deb
          path: dist
      - run: packaging/test-install.sh dist/qualfy-qa_*_all.deb ${{ matrix.ubuntu }}

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds from the checked-out tree (the tag's GitHub tarball has identical content),
      # then installs it with pacman -U and smoke-tests it.
      - run: packaging/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [python, deb, deb-smoke, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "qualfy-qa ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
